<script>
const img=document.getElementById("src");
const ROW_PX=96,COL_PX=104;
let playing=null;
document.querySelectorAll("canvas").forEach((cv,idx)=>{
  const r=Math.floor(idx/12),c=idx%12;
  const ctx=cv.getContext("2d");
  img.onload=()=>ctx.drawImage(img,c*ROW_PX,r*COL_PX,ROW_PX,COL_PX,0,0,ROW_PX,COL_PX);
  cv.onclick=()=>{ if(playing)clearInterval(playing); const c0=cv;
    const n=document.querySelectorAll("#t tr")[r].querySelectorAll("canvas").length;
    let f=c, dir=1;
    playing=setInterval(()=>{ f=(f+dir+n)%n; if(f>=n){f=n-1;dir=-1;} if(f<=0)dir=1;
      const t=document.querySelectorAll("#t tr")[r].querySelectorAll("canvas")[f];
      const cc=t.getContext("2d"); cc.clearRect(0,0,ROW_PX,COL_PX);
      cc.drawImage(img,f*ROW_PX,r*COL_PX,ROW_PX,COL_PX,0,0,ROW_PX,COL_PX); },200);
  };
});
