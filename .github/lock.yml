# Lock bot 配置
# 自动锁定过时的 issue 和 PR

# 只处理 issues
only: issues

# 配置
daysUntilLock: 365

# 锁定原因
lockLabel: outdated
lockComment: >
  This issue has been automatically locked because it has not had
  recent activity. Please open a new issue for related bugs.

# 忽略的标签
exemptLabels:
  - pinned
  - security
  - bug
  - enhancement

# 忽略的里程碑
exemptMilestones: true

# 忽略有 assignee 的 issue
exemptAssignees: true

# 设置为 true 以仅处理 issues 而不是 PR
onlyIssues: false

# 设置为 true 以仅处理 PR 而不是 issues
onlyPRs: false
