# Auto Assign 配置
# 自动分配 PR reviewer

# 添加 reviewer
addReviewers: true

# 添加 assignees
addAssignees: author

# reviewer 列表
reviewers:
  - your-github-username

# 数量限制
numberOfReviewers: 1

# 排除的 reviewer
skipKeywords:
  - wip
  - draft

# 使用轮询算法
useRoundRobin: false

# 使用负荷均衡算法
useLoadBalancing: false
